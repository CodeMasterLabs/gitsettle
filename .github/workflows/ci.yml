name: Verify GitSettle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust and WASM target
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - run: cargo fmt --manifest-path contracts/gitsettle/Cargo.toml --check
      - run: cargo test --manifest-path contracts/gitsettle/Cargo.toml --locked
      - run: cargo clippy --manifest-path contracts/gitsettle/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo build --manifest-path contracts/gitsettle/Cargo.toml --target wasm32-unknown-unknown --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitsettle-contract
          path: contracts/gitsettle/target/wasm32-unknown-unknown/release/gitsettle.wasm

  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEMO_MODE: "true"
      DATABASE_PATH: /tmp/gitsettle-ci.sqlite
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-review
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  containers:
    needs: [contract, application]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEMO_MODE: "true"
      APP_PORT: "3000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start from a clean checkout with an empty volume
        run: docker compose up --build --detach --wait
      - name: Check application and web credential isolation
        run: |
          curl --fail --silent http://localhost:3000/api/health
          docker compose exec -T web node -e "for(const key of ['NEAR_VERIFIER_PRIVATE_KEY','NEAR_PRIVATE_KEY','GITHUB_TOKEN']) { if(process.env[key]) throw new Error('Unexpected credential in web: '+key); }"
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
