<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">GitSettle and AgentGuard by CodeMaster Labs</title>
  <desc id="description">GitSettle provides contribution escrow for GitHub work on NEAR. AgentGuard provides owner-controlled spending vaults for AI agents, with on-chain limits, human approval queues and optional signed TEE risk verdicts. Their shared baseline is pinned MIT recipient and text checks, which GitSettle applies locally. AgentGuard vault, TEE and MCP components remain separate.</desc>
  <rect width="1200" height="440" rx="26" fill="#080808"/>
  <g fill="#1A1A1A" stroke="#353530">
    <rect x="24" y="24" width="564" height="278" rx="22"/>
    <rect x="612" y="24" width="564" height="278" rx="22"/>
  </g>
  <circle cx="80" cy="82" r="32" fill="#F0D957"/>
  <g transform="translate(61 63) scale(1.6)" fill="none" stroke="#080808" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="18" r="3"/>
    <circle cx="6" cy="6" r="3"/>
    <path d="M6 21V9a9 9 0 0 0 9 9"/>
  </g>
