  <circle cx="668" cy="82" r="32" fill="#F0D957"/>
  <path d="M668 62l16 7v13c0 12-7 20-16 24-9-4-16-12-16-24V69z" fill="none" stroke="#080808" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M660 82l6 6 11-13" fill="none" stroke="#080808" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="#F7F7F2" font-size="40" font-weight="700">
      <text x="130" y="96">GitSettle</text>
      <text x="718" y="96">AgentGuard</text>
    </g>
    <g fill="#F0D957" font-size="24">
      <text x="48" y="151">Contribution escrow</text>
      <text x="636" y="151">Spending firewall for AI agents</text>
    </g>
    <g fill="#E9E9E2" font-size="23">
      <text x="48" y="198">Fund GitHub issues on NEAR.</text>
      <text x="48" y="232">Verify the merge and settle the reward.</text>
      <text x="636" y="198">Owner-controlled vaults and on-chain limits.</text>
      <text x="636" y="232">Human approval queues; optional signed</text>
      <text x="636" y="266">TEE risk verdicts.</text>
    </g>
    <text x="48" y="352" fill="#F7F7F2" font-size="23">Shared baseline: pinned MIT recipient and text checks.</text>
    <text x="48" y="385" fill="#AAA9A2" font-size="20">GitSettle applies them locally; AgentGuard vaults, TEE and MCP remain separate.</text>
    <text x="48" y="418" fill="#AAA9A2" font-size="18">Built by CodeMaster Labs</text>
  </g>
</svg>
