name: gitsettle

x-runtime: &runtime
  image: gitsettle:local
  build:
    context: .
    target: runtime
  init: true
  restart: unless-stopped
  user: "1000:1000"
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777
  volumes:
    - ${GITSETTLE_DATA_DIR:-gitsettle-data}:/data
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *runtime
    command: ["npm", "start"]
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/gitsettle.sqlite
      # Empty mode + no contract opens the explicitly labeled local demo.
      DEMO_MODE: ${DEMO_MODE:-}
      NEAR_NETWORK_ID: testnet
      NEAR_CONTRACT_ID: ${NEAR_CONTRACT_ID:-}
      NEAR_RPC_URL: ${NEAR_RPC_URL:-https://rpc.testnet.near.org}
      AGENTGUARD_ENABLED: ${AGENTGUARD_ENABLED:-true}
      AGENTGUARD_MAX_PAYOUT_NEAR: ${AGENTGUARD_MAX_PAYOUT_NEAR:-5}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      SUPPORT_ADMIN_ACCOUNTS: ${SUPPORT_ADMIN_ACCOUNTS:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # Intentionally no env_file: a web compromise must not expose signing keys.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /app/apps/web/.next/cache:rw,nosuid,size=128m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    stop_grace_period: 30s

  verifier:
    <<: *runtime
    command: ["npm", "run", "verifier"]
    depends_on:
      web:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/gitsettle.sqlite
      DEMO_MODE: ${DEMO_MODE:-}
      NEAR_NETWORK_ID: testnet
      NEAR_CONTRACT_ID: ${NEAR_CONTRACT_ID:-}
      NEAR_RPC_URL: ${NEAR_RPC_URL:-https://rpc.testnet.near.org}
      NEAR_VERIFIER_ACCOUNT_ID: ${NEAR_VERIFIER_ACCOUNT_ID:-}
      NEAR_VERIFIER_PRIVATE_KEY: ${NEAR_VERIFIER_PRIVATE_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_VERSION: ${GITHUB_API_VERSION:-2026-03-10}
      VERIFIER_INTERVAL_MS: ${VERIFIER_INTERVAL_MS:-15000}
      VERIFIER_REJECT_INVALID: ${VERIFIER_REJECT_INVALID:-true}
      AGENTGUARD_ENABLED: ${AGENTGUARD_ENABLED:-true}
      AGENTGUARD_MAX_PAYOUT_NEAR: ${AGENTGUARD_MAX_PAYOUT_NEAR:-5}
      AGENTGUARD_DENIED_RECIPIENTS: ${AGENTGUARD_DENIED_RECIPIENTS:-}
      AGENTGUARD_KNOWN_RECIPIENTS: ${AGENTGUARD_KNOWN_RECIPIENTS:-}
    # No ports: this worker reads GitHub/NEAR and writes only the shared audit DB.
    stop_grace_period: 90s

volumes:
  gitsettle-data:
